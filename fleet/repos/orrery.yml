schema: 1
visibility: "private"
license: "none"
params:
  renovate: true
  dependabot:
    - package-ecosystem: "github-actions"
      group: "github-actions"
      directory: "/"
    - package-ecosystem: "opentofu"
      group: "opentofu"
      directories: ["/", "/modules/*"]
      ignore:
        - dependency-name: "cloudflare/cloudflare"
          reason: "5.26.0 plans include_shadow_metadata on every DNS record and the apply fails; reassess with the next release: https://github.com/cloudflare/terraform-provider-cloudflare/issues/7387"
          versions: ["5.26.0"]
  zizmor:
    advanced-security: false
    pull-request-paths: [".github/workflows/**"]
    timeout-minutes: 5
  pinprick-audit:
    advanced-security: "false"
    fail-on-findings: true
    pull-request: true
    timeout-minutes: 5
    push-paths: [".github/workflows/**"]
exceptions:
  codeql: "OpenTofu-only private infra; tofu.yml owns IaC validation"
  conclusion: "org-ruleset: the exact-head Plan status gates the inline PR audit and remains the required merge gate"
