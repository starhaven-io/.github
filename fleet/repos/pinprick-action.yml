schema: 1
visibility: "public"
license: "mit"
params:
  ruby-runtime:
    version-file: ".ruby-version"
    lock-files: ["Gemfile.lock"]
  renovate: true
  conclusion:
    workflow: ".github/workflows/self-test.yml"
    audit-jobs: ["validate", "console", "contract", "sarif", "zizmor"]
    noncritical-jobs:
      console_preview: "preview images report compatibility without gating supported release images"
  dependabot:
    - package-ecosystem: "bundler"
      group: "bundler-dependencies"
      directory: "/"
    - package-ecosystem: "github-actions"
      group: "github-actions"
      directory: "/"
      ignore:
        - dependency-name: "github/codeql-action/*"
          reason: "4.38.3 and later bundle apache-arrow code generation that pinprick cannot verify; reassess with https://github.com/github/codeql-action/issues/4252"
          versions: [">=4.38.3"]
  link-check:
    targets: "--config lychee.toml README.md RELEASING.md SECURITY.md"
    build-site: false
    authenticated-github: true
    schedule: "0 14 * * 1"
    concurrency-group: "link-check"
  codeql:
    languages: ["actions", "ruby"]
    paths: [".github/workflows/**", "action.yml", ".github/scripts/**", "test/**", "Gemfile", "Gemfile.lock", ".ruby-version"]
    runner: "ubuntu-slim"
    timeout-minutes: 10
    schedule: "0 13 * * 1"
  zizmor:
    push-paths: ["action.yml"]
    schedule: "30 13 * * 1"
    timeout-minutes: 10
  readme:
    license:
      text: |-
        This action wrapper is licensed under the MIT License. See [LICENSE](LICENSE).

        The pinprick engine downloaded and run by this action is a separate project
        licensed under the [GNU Affero General Public License v3.0 only](https://github.com/starhaven-io/pinprick/blob/main/LICENSE).
        Using this wrapper does not relicense pinprick or change pinprick's license
        terms.
exceptions:
  pinprick-audit: "self-test: the action validates pinprick behavior through its dedicated workflow"
