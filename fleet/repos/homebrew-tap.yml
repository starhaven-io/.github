schema: 1
visibility: "public"
license: "mit"
params:
  renovate: true
  conclusion:
    workflow: ".github/workflows/ci.yml"
    audit-jobs: ["pinprick"]
    pinprick-jobs: ["pinprick"]
  dependabot:
    - package-ecosystem: "github-actions"
      group: "github-actions"
      directory: "/"
  link-check:
    targets: "--config lychee.toml README.md"
    build-site: false
    authenticated-github: true
    schedule: "0 14 * * 1"
    concurrency-group: "link-check"
  codeql:
    languages: ["actions"]
    paths: [".github/workflows/**"]
    runner: "ubuntu-slim"
    timeout-minutes: 30
  pinprick-audit:
    advanced-security: "${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}"
    fail-on-findings: true
    pull-request: true
    accept-action-findings:
      - action: "Homebrew/actions/setup-homebrew"
        path: "setup-homebrew/main.sh"
        category: "shell_fetch"
        severity: "high"
        description: "shell executing fetched content via command substitution — bypasses pinning"
        command: 'NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"'
        reason: "setup-homebrew installs Homebrew from Homebrew/install HEAD when a runner lacks it, which Homebrew keeps deliberately rather than pinning each installer change"
  readme:
    badges:
      workflow: "ci.yml"
      extra: []
    license:
      text: "This tap is licensed under the [MIT License](LICENSE)."
exceptions: {}
