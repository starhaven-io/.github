schema: 1
visibility: "public"
license: "mit"
params:
  ruby-runtime:
    version-file: "fleet/.ruby-version"
    lock-files: ["fleet/Gemfile.lock"]
    require-lock-version: true
    update-companions: true
  renovate: true
  conclusion:
    workflow: ".github/workflows/conclusion.yml"
    audit-jobs: ["audit"]
    pinprick-jobs: ["audit"]
  dependabot:
    - package-ecosystem: "bundler"
      group: "bundler-dependencies"
      directory: "/fleet"
    - package-ecosystem: "npm"
      group: "fleet-validator-dependencies"
      directory: "/fleet/validator"
    - package-ecosystem: "github-actions"
      group: "github-actions"
      directory: "/"
      ignore:
        - dependency-name: "actions/setup-node"
          reason: "pinprick's source scan does not yet cover setup-node v7; reassess when it does"
          versions: [">=7.0.0"]
        - dependency-name: "github/codeql-action/*"
          reason: "4.38.3 and later bundle apache-arrow code generation that pinprick cannot verify; reassess with https://github.com/github/codeql-action/issues/4252"
          versions: [">=4.38.3"]
  link-check:
    targets: "--config lychee.toml README.md profile/README.md CONTRIBUTING.md SECURITY.md"
    build-site: false
    authenticated-github: true
    schedule: "0 14 * * 1"
    pull-request-paths:
      - "README.md"
      - "profile/README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "lychee.toml"
    concurrency-group: "link-check-${{ github.ref }}"
  codeql:
    languages: ["actions", "ruby"]
    paths: [".github/workflows/**", "fleet/**"]
    runner: "ubuntu-slim"
    timeout-minutes: 30
  pinprick-audit:
    advanced-security: "${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}"
    fail-on-findings: true
    pull-request: true
  readme:
    license:
      text: "This community metadata repository is licensed under the [MIT License](LICENSE)."
exceptions: {}
