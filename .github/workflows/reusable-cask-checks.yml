name: Wait for Homebrew cask checks

on:
  workflow_call:
    inputs:
      pr-number:
        type: string
        required: true
      head-sha:
        type: string
        required: true
      head-branch:
        type: string
        required: true

permissions: {}

jobs:
  wait:
    name: Wait for tap branch policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the polling helper at the called workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: |
            fleet/.ruby-version
            fleet/wait_cask_checks.rb
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@145243922b4465b78e04dd66294782c7de45901f # v1.345.0
        with:
          working-directory: fleet

      - name: Wait for checks on the validated tap head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
          HEAD_SHA: ${{ inputs.head-sha }}
          HEAD_BRANCH: ${{ inputs.head-branch }}
        run: ruby fleet/wait_cask_checks.rb
