name: Fleet Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "fleet/VERSION"

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: fleet-release
  cancel-in-progress: false

jobs:
  release-pr:
    name: Release PR
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: starhaven
      deployment: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          working-directory: fleet

      - name: Compute next version
        id: version
        env:
          TZ: America/Los_Angeles
        run: |
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          ruby fleet/version.rb verify-tag \
            --repository . \
            --version-file fleet/VERSION \
            --main-ref HEAD >/dev/null
          VERSION=$(ruby fleet/version.rb next --version-file fleet/VERSION)
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Mint write token
        id: write-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create verified release commit and open PR
        env:
          GH_TOKEN: ${{ steps.write-token.outputs.token }}
          APP_SLUG: ${{ steps.write-token.outputs.app-slug }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TITLE="chore(fleet): release ${VERSION}"
          BRANCH="fleet-release-${VERSION}"
          BOT_USER="${APP_SLUG}[bot]"
          BOT_ID=$(gh api "/users/${BOT_USER}" --jq .id)
          BOT_EMAIL="${BOT_ID}+${BOT_USER}@users.noreply.github.com"
          BASE_SHA=$(git rev-parse HEAD)

          BODY_FILE="${RUNNER_TEMP}/fleet-release-pr-body.md"
          {
            echo "Release ${VERSION} of fleet-managed surfaces."
            echo ""
            echo "This bumps fleet/VERSION. The merge to main will create the annotated ${VERSION} tag."
            echo "Keep this as one commit and merge it with squash so the VERSION-changing commit remains the release tip."
          } > "${BODY_FILE}"

          PULLS_FILE="${RUNNER_TEMP}/fleet-release-open-pulls.json"
          list_open_pulls() {
            gh api --paginate "repos/${REPOSITORY}/pulls?state=open&per_page=100" | jq -s 'add' > "${PULLS_FILE}"
          }
          verified_pull() {
            local command=$1
            local result
            for attempt in 1 2 3 4 5; do
              list_open_pulls
              if result=$(ruby fleet/pr_identity.rb "${command}" \
                --repository "${REPOSITORY}" \
                --branch "${BRANCH}" \
                --base main \
                --author "${BOT_USER}" \
                --head-oid "${COMMIT_OID}" < "${PULLS_FILE}"); then
                printf '%s' "${result}"
                return 0
              fi
              if [ "${attempt}" -eq 5 ]; then
                return 1
              fi
              sleep 2
            done
          }
          list_open_pulls
          ruby fleet/pr_identity.rb preflight \
            --repository "${REPOSITORY}" \
            --branch "${BRANCH}" \
            --base main \
            --author "${BOT_USER}" < "${PULLS_FILE}"

          if gh api "repos/${REPOSITORY}/git/ref/heads/${BRANCH}" >/dev/null 2>&1; then
            gh api "repos/${REPOSITORY}/git/refs/heads/${BRANCH}" \
              -X PATCH \
              -f "sha=${BASE_SHA}" \
              -F force=true
          else
            gh api "repos/${REPOSITORY}/git/refs" \
              -X POST \
              -f "ref=refs/heads/${BRANCH}" \
              -f "sha=${BASE_SHA}"
          fi

          CONTENT=$(printf "%s\n" "${VERSION}" | ruby -e 'print [STDIN.read].pack("m0")')
          ADDITIONS=$(jq -n --arg contents "${CONTENT}" '[{ path: "fleet/VERSION", contents: $contents }]')
          COMMIT_BODY="Signed-off-by: ${BOT_USER} <${BOT_EMAIL}>"

          COMMIT_RESPONSE="${RUNNER_TEMP}/fleet-release-commit-response.json"
          jq -n \
            --arg repo "${REPOSITORY}" \
            --arg branch "${BRANCH}" \
            --arg title "${TITLE}" \
            --arg body "${COMMIT_BODY}" \
            --arg head "${BASE_SHA}" \
            --argjson additions "${ADDITIONS}" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid url } } }",
              variables: {
                input: {
                  branch: { repositoryNameWithOwner: $repo, branchName: $branch },
                  message: { headline: $title, body: $body },
                  fileChanges: { additions: $additions },
                  expectedHeadOid: $head
                }
              }
            }' | gh api graphql --input - > "${COMMIT_RESPONSE}"
          COMMIT_OID=$(jq -er '.data.createCommitOnBranch.commit.oid' "${COMMIT_RESPONSE}")

          OPEN_PR=$(verified_pull optional)

          if [ -n "${OPEN_PR}" ]; then
            gh pr edit "${OPEN_PR}" --repo "${REPOSITORY}" --title "${TITLE}" --body-file "${BODY_FILE}"
          else
            jq -n \
              --arg title "${TITLE}" \
              --arg head "${REPOSITORY%%/*}:${BRANCH}" \
              --rawfile body "${BODY_FILE}" \
              '{ title: $title, head: $head, base: "main", body: $body }' |
              gh api "repos/${REPOSITORY}/pulls" -X POST --input -
          fi

          verified_pull select >/dev/null

          ruby fleet/pr_identity.rb stale \
            --repository "${REPOSITORY}" \
            --prefix "fleet-release-" \
            --current-branch "${BRANCH}" \
            --base main \
            --author "${BOT_USER}" < "${PULLS_FILE}" |
          while IFS= read -r STALE; do
            gh pr close "${STALE}" --repo "${REPOSITORY}" --delete-branch \
              --comment "Superseded by the ${VERSION} release."
          done

  tag:
    name: Tag
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: starhaven
      deployment: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          working-directory: fleet

      - name: Read version
        id: version
        env:
          TZ: America/Los_Angeles
        run: |
          VERSION=$(ruby fleet/version.rb verify-transition \
            --repository . \
            --commit "${GITHUB_SHA}" \
            --version-file fleet/VERSION)
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Mint write token
        id: write-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Create release tag
        env:
          GH_TOKEN: ${{ steps.write-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          verify_release_tag() {
            ref_file="${RUNNER_TEMP}/fleet-release-ref.json"
            tag_file="${RUNNER_TEMP}/fleet-release-tag.json"
            gh api "repos/${REPOSITORY}/git/ref/tags/${VERSION}" > "${ref_file}"
            TAG_SHA=$(jq -er 'select(.object.type == "tag") | .object.sha' "${ref_file}")
            gh api "repos/${REPOSITORY}/git/tags/${TAG_SHA}" > "${tag_file}"
            jq -e \
              --arg version "${VERSION}" \
              --arg commit "${GITHUB_SHA}" \
              '.tag == $version and
               .message == ("Fleet " + $version) and
               .object.type == "commit" and
               .object.sha == $commit' "${tag_file}" >/dev/null
          }

          if gh api "repos/${REPOSITORY}/git/ref/tags/${VERSION}" >/dev/null 2>&1; then
            verify_release_tag
            echo "Authenticated existing tag ${VERSION} at ${GITHUB_SHA}."
            exit 0
          fi

          TAG_SHA=$(gh api "repos/${REPOSITORY}/git/tags" \
            -X POST \
            -f "tag=${VERSION}" \
            -f "message=Fleet ${VERSION}" \
            -f "object=${GITHUB_SHA}" \
            -f "type=commit" \
            --jq .sha)

          if ! gh api "repos/${REPOSITORY}/git/refs" \
            -X POST \
            -f "ref=refs/tags/${VERSION}" \
            -f "sha=${TAG_SHA}"; then
            echo "Tag ref creation raced; authenticating the winner."
          fi
          verify_release_tag

      - name: Dispatch fleet sync from trusted main
        env:
          GH_TOKEN: ${{ steps.write-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          jq -n \
            --arg version "${VERSION}" \
            '{ event_type: "fleet-sync", client_payload: { version: $version } }' |
            gh api "repos/${REPOSITORY}/dispatches" -X POST --input -
