name: Reusable Fleet Guard

on:
  workflow_call:
    inputs:
      repo-name:
        type: string
        required: true

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  guard:
    name: Guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check actor exemption
        id: exemption
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "${AUTHOR}" == "starhaven-bot[bot]" && "${HEAD_REF}" == fleet-sync-* &&
            "${HEAD_REPOSITORY}" == "${GITHUB_REPOSITORY}" &&
            ( "${GITHUB_REPOSITORY}" != "starhaven-io/.github" ||
              ( "${ACTOR}" == "starhaven-bot[bot]" && "${TRIGGERING_ACTOR}" == "starhaven-bot[bot]" ) ) ]]; then
            echo "exempt=true" >> "${GITHUB_OUTPUT}"
          elif [[ "${ACTOR}" == "dependabot[bot]" ]]; then
            echo "exempt=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exempt=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout consumer
        if: steps.exemption.outputs.exempt != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the merged base
        id: base
        if: steps.exemption.outputs.exempt != 'true'
        # The checkout is GitHub's test merge of the head into the current base.
        # pull_request.base.sha is not refreshed when the base branch advances,
        # so diffing against it would attribute a newer base, such as a fleet
        # sync, to the pull request.
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          read -r -a parents <<< "$(git rev-list --parents -n 1 HEAD)"
          if (( ${#parents[@]} != 3 )) || [[ -z "${HEAD_SHA}" || "${parents[2]}" != "${HEAD_SHA}" ]]; then
            echo "::error::fleet guard requires the pull request merge commit checkout"
            exit 1
          fi
          echo "sha=${parents[1]}" >> "${GITHUB_OUTPUT}"

      - name: Read the caller pin
        id: pin
        if: steps.exemption.outputs.exempt != 'true' && github.repository != 'starhaven-io/.github'
        # The uses: pin is the single source of truth for the hub version;
        # read it from the base tree so a pull request cannot choose canon.
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          if [[ -z "${BASE_SHA}" ]]; then
            echo "::error::fleet guard requires a pull_request base SHA"
            exit 1
          fi
          BASE_REF=$(git show "${BASE_SHA}:.github/workflows/fleet-guard.yml" \
            | grep -oE "reusable-fleet-guard\.yml@[0-9a-f]{40}" \
            | head -1 \
            | cut -d@ -f2 || true)
          HEAD_REF=$(grep -oE "reusable-fleet-guard\.yml@[0-9a-f]{40}" .github/workflows/fleet-guard.yml \
            | head -1 \
            | cut -d@ -f2 || true)
          if [[ -z "${BASE_REF}" ]]; then
            echo "::error::could not read the fleet-guard pin from the base .github/workflows/fleet-guard.yml"
            exit 1
          fi
          if [[ -z "${HEAD_REF}" ]]; then
            echo "::error::could not read the fleet-guard pin from .github/workflows/fleet-guard.yml"
            exit 1
          fi
          if [[ "${HEAD_REF}" != "${BASE_REF}" ]]; then
            echo "::error::fleet-guard pin changes land through a hub release, not a consumer PR"
            exit 1
          fi
          echo "ref=${BASE_REF}" >> "${GITHUB_OUTPUT}"

      - name: Checkout fleet hub
        if: steps.exemption.outputs.exempt != 'true' && github.repository != 'starhaven-io/.github'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: starhaven-io/.github
          ref: ${{ steps.pin.outputs.ref }}
          path: hub
          # Pin validation reads other pinned commits and tags from this
          # checkout; a shallow clone makes every pin look invalid.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Ruby
        if: steps.exemption.outputs.exempt != 'true'
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          working-directory: ${{ github.repository == 'starhaven-io/.github' && 'fleet' || 'hub/fleet' }}

      - name: Guard fleet-managed surfaces
        if: steps.exemption.outputs.exempt != 'true'
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          REPO_NAME: ${{ inputs.repo-name }}
        # A hub pull request carries its canon in-tree, so the hub checks
        # against itself; an older pinned canon would fail every
        # canon-changing pull request by construction.
        run: |
          HUB_ROOT=hub
          HUB_FLAG=()
          if [[ "${GITHUB_REPOSITORY}" == "starhaven-io/.github" ]]; then
            HUB_ROOT=.
            HUB_FLAG=(--hub)
          fi
          ruby "${HUB_ROOT}/fleet/sync.rb" --hub-root "${HUB_ROOT}" --repo-root . --repo-name "${REPO_NAME}" --guard "${BASE_SHA}" "${HUB_FLAG[@]}"
