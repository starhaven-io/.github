name: Fleet Validate

on:
  workflow_call:

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.repos.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          working-directory: fleet
          bundler-cache: true

      - name: Set up Node for Renovate validation
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.11.0
          package-manager-cache: false

      - name: Install Renovate validator
        env:
          npm_config_registry: https://registry.npmjs.org/
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix fleet/validator
          echo "FLEET_RENOVATE_VALIDATOR=${GITHUB_WORKSPACE}/fleet/validator/node_modules/.bin/renovate-config-validator" >> "${GITHUB_ENV}"

      - name: Check renderer and templates
        run: |
          ruby -c fleet/sync.rb
          ruby -c fleet/version.rb
          ruby -c fleet/pr_identity.rb
          ruby -rerb -ryaml -e '
            Dir["fleet/templates/*.erb"].each do |template|
              ERB.new(File.read(template, encoding: "UTF-8"), trim_mode: "-")
            end
            Dir[".github/workflows/*.{yml,yaml}"].each do |workflow|
              YAML.safe_load(File.read(workflow, encoding: "UTF-8"), permitted_classes: [], aliases: false)
            end
          '

      - name: Audit hub workflows
        env:
          ZIZMOR_IMAGE: "ghcr.io/zizmorcore/zizmor:1.30.0@sha256:1ba0035c343f50e85fde29beb0d78e4db448eaa0c762a11a09805d241424ee03"
        run: |
          docker run --rm --network none \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            --workdir /workspace "${ZIZMOR_IMAGE}" \
            --offline --strict-collection --persona auditor -- .github/workflows/

      - name: Validate Renovate preset
        working-directory: ${{ runner.temp }}
        run: >-
          "${FLEET_RENOVATE_VALIDATOR}" --strict --no-global
          "${GITHUB_WORKSPACE}/renovate-config.json"

      - name: Run test suites
        env:
          BUNDLE_GEMFILE: fleet/Gemfile
        run: bundle exec ruby -e 'Dir["fleet/test/*_test.rb"].sort.each { |file| require File.expand_path(file) }'

      - name: Lint renderer
        env:
          BUNDLE_GEMFILE: fleet/Gemfile
        run: bundle exec rubocop --no-color fleet/

      - name: Build repository matrix
        id: repos
        run: |
          ruby -ryaml -rjson -e '
            data = YAML.safe_load(File.read("fleet/repos.yml"), permitted_classes: [], aliases: false)
            matrix = {
              include: data.fetch("repos").map do |repo|
                system("ruby", "fleet/sync.rb", "--repo-name", repo, "--validate-only") ||
                  abort("invalid fleet config: #{repo}")
                config = YAML.safe_load(
                  File.read("fleet/repos/#{repo}.yml"), permitted_classes: [], aliases: false
                )
                {
                  repo: repo,
                  visibility: config.fetch("visibility"),
                  renovate: config.fetch("params", {}).fetch("renovate", false)
                }
              end
            }
            File.open(ENV.fetch("GITHUB_OUTPUT"), "a") { |file| file.puts("matrix=#{JSON.generate(matrix)}") }
          '

  dry-run:
    name: Dry run (${{ matrix.repo }})
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout fleet hub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: hub
          fetch-tags: true
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          working-directory: hub/fleet

      - name: Checkout consumer
        id: clone
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: starhaven-io/${{ matrix.repo }}
          path: repo
          persist-credentials: false

      - name: Note skipped consumer
        if: steps.clone.outcome == 'failure' && matrix.visibility == 'private'
        env:
          REPO_NAME: ${{ matrix.repo }}
        run: |
          # The pull_request token cannot read private consumers; the real sync validates those.
          echo "::notice::skipping ${REPO_NAME}: not readable from a pull_request run"

      - name: Reject unreadable public consumer
        if: steps.clone.outcome == 'failure' && matrix.visibility == 'public'
        env:
          REPO_NAME: ${{ matrix.repo }}
        run: |
          echo "::error::public fleet consumer ${REPO_NAME} could not be checked out"
          exit 1

      - name: Set up Node for Renovate validation
        if: steps.clone.outcome == 'success' && matrix.renovate
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.11.0
          package-manager-cache: false

      - name: Install Renovate validator
        if: steps.clone.outcome == 'success' && matrix.renovate
        env:
          npm_config_cache: ${{ runner.temp }}/renovate-npm-cache
          npm_config_registry: https://registry.npmjs.org/
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix hub/fleet/validator

      - name: Render and require idempotence
        if: steps.clone.outcome == 'success'
        env:
          FLEET_HUB_SHA: ${{ github.sha }}
          REPO_NAME: ${{ matrix.repo }}
        run: |
          ruby hub/fleet/sync.rb --hub-root hub --repo-root repo --repo-name "${REPO_NAME}"
          ruby hub/fleet/sync.rb --hub-root hub --repo-root repo --repo-name "${REPO_NAME}" --check

      - name: Check rendered tree hygiene
        if: steps.clone.outcome == 'success'
        working-directory: repo
        run: |
          git add -A
          git diff --cached --check

      - name: Audit rendered workflows
        if: steps.clone.outcome == 'success'
        working-directory: repo
        env:
          REPO_NAME: ${{ matrix.repo }}
          ZIZMOR_IMAGE: "ghcr.io/zizmorcore/zizmor:1.30.0@sha256:1ba0035c343f50e85fde29beb0d78e4db448eaa0c762a11a09805d241424ee03"
        run: |
          workflow_manifest="${RUNNER_TEMP}/fleet-managed-workflows"
          ruby ../hub/fleet/sync.rb \
            --hub-root ../hub \
            --repo-root . \
            --repo-name "${REPO_NAME}" \
            --list-managed-workflows > "${workflow_manifest}"
          mapfile -t workflow_paths < "${workflow_manifest}"
          if (( ${#workflow_paths[@]} == 0 )); then
            echo "::error::No fleet-managed workflows to audit."
            exit 1
          fi
          docker run --rm --network none \
            --volume "${GITHUB_WORKSPACE}/repo:/workspace:ro" \
            --workdir /workspace "${ZIZMOR_IMAGE}" \
            --offline --strict-collection --persona auditor -- "${workflow_paths[@]}"

      - name: Validate rendered Renovate stub
        if: steps.clone.outcome == 'success' && matrix.renovate
        working-directory: ${{ runner.temp }}
        run: >-
          "${GITHUB_WORKSPACE}/hub/fleet/validator/node_modules/.bin/renovate-config-validator"
          --strict --no-global "${GITHUB_WORKSPACE}/repo/renovate.json"
