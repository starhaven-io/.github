name: Reusable Link Check

on:
  workflow_call:
    inputs:
      args:
        type: string
        required: true
      build-site:
        type: boolean
        default: false
      site-directory:
        type: string
        default: ""
      authenticated-github:
        type: boolean
        default: false

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  lychee:
    name: Check links
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: inputs.build-site
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Validate npm install policy
        if: inputs.build-site
        env:
          SITE_DIRECTORY: ${{ inputs.site-directory }}
        run: node scripts/check-npm-install-policy.mjs "${SITE_DIRECTORY:-.}"

      - name: Install dependencies
        if: inputs.build-site && inputs.site-directory == ''
        # Fail closed on unreviewed install scripts (npm v12 default; see allowScripts in package.json).
        run: npm ci --strict-allow-scripts

      - name: Install dependencies
        if: inputs.build-site && inputs.site-directory != ''
        working-directory: ${{ inputs.site-directory }}
        # Fail closed on unreviewed install scripts (npm v12 default; see allowScripts in package.json).
        run: npm ci --strict-allow-scripts

      - name: Build site
        if: inputs.build-site && inputs.site-directory == ''
        run: npm run build

      - name: Build site
        if: inputs.build-site && inputs.site-directory != ''
        working-directory: ${{ inputs.site-directory }}
        run: npm run build

      - name: Install lychee
        env:
          LYCHEE_SHA256: "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a"
        run: |
          archive="${RUNNER_TEMP}/lychee.tar.gz"
          curl --fail --location --silent --show-error \
            --output "${archive}" \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz"
          echo "${LYCHEE_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Check links
        env:
          # Check github.com links with the authenticated rate limit (1000/hr)
          # instead of the 60/hr anonymous pool, avoiding flaky 429 failures.
          GITHUB_TOKEN: ${{ inputs.authenticated-github && github.token || '' }}
          LYCHEE_ARGS: ${{ inputs.args }}
        run: |
          eval "set -- ${LYCHEE_ARGS}"
          report="${RUNNER_TEMP}/lychee.md"
          status=0
          lychee --format markdown --output "${report}" "$@" || status=$?
          test -f "${report}"
          tee -a "${GITHUB_STEP_SUMMARY}" < "${report}"
          # An empty scan is a misconfigured target, not a clean result.
          if grep -Eq 'Total[[:space:]]*\|[[:space:]]*0[[:space:]]*\|' "${report}"; then
            echo "::error::lychee found no links to check"
            exit 1
          fi
          exit "${status}"
