name: Fleet Guard (required)

# The organization ruleset sources this workflow and its renderer from trusted
# hub main, so pull-request code cannot weaken it and fixes do not wait for a
# fleet release. DCO is enforced separately by dco-required.yml.

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-required-${{ github.ref }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  guard:
    name: Guard
    # The hub guards its own PRs in-tree with --hub; this required workflow is
    # for consumers, so skip it when it runs on the hub itself.
    if: github.repository != 'starhaven-io/.github'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The sync App gets no exemption: its fleet-sync PRs must match the
      # authenticated release render exactly, and its other PRs face the guard.
      - name: Select guard mode
        id: mode
        env:
          ACTOR: ${{ github.actor }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "${AUTHOR}" == "starhaven-bot[bot]" && "${HEAD_REF}" == fleet-sync-* &&
            "${HEAD_REPOSITORY}" == "${GITHUB_REPOSITORY}" ]]; then
            echo "mode=sync" >> "${GITHUB_OUTPUT}"
          elif [[ "${ACTOR}" == "dependabot[bot]" ]]; then
            echo "mode=exempt" >> "${GITHUB_OUTPUT}"
          else
            echo "mode=guard" >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout consumer
        if: steps.mode.outputs.mode != 'exempt'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout fleet hub
        if: steps.mode.outputs.mode != 'exempt'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: starhaven-io/.github
          ref: main
          path: hub
          # Pin resolution reads tags and other pinned commits from this checkout;
          # a shallow clone makes every pin look invalid.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Ruby
        if: steps.mode.outputs.mode != 'exempt'
        uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1.326.0
        with:
          working-directory: hub/fleet

      - name: Guard fleet-managed surfaces
        if: steps.mode.outputs.mode == 'guard'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          if [[ -z "${BASE_SHA}" ]]; then
            echo "::error::fleet guard requires a pull_request base SHA"
            exit 1
          fi
          ruby hub/fleet/sync.rb --hub-root hub --repo-root . --repo-name "${REPO_NAME}" --guard "${BASE_SHA}"

      - name: Verify fleet sync pull request
        if: steps.mode.outputs.mode == 'sync'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          ruby hub/fleet/sync_pr_check.rb --hub-root hub --repo-root . --repo-name "${REPO_NAME}" \
            --base "${BASE_SHA}" --head "${HEAD_SHA}" --branch "${HEAD_REF}"
