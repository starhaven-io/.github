name: Link Check

on:
  pull_request:
    paths:
      - "README.md"
      - "profile/README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "lychee.toml"
  schedule:
    - cron: "0 14 * * 1" # every Monday at 14:00 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: "link-check-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  lychee:
    name: Check links
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-link-check.yml@a2332e3f09757e3a96fdb76b0492a129f0c1a613 # v2026.09.06.5
    with:
      args: "--config lychee.toml README.md profile/README.md CONTRIBUTING.md SECURITY.md"
      build-site: false
      site-directory: ""
      authenticated-github: true
