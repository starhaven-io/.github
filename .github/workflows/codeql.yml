name: CodeQL

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "fleet/**"

concurrency:
  group: "codeql-${{ github.ref }}"
  cancel-in-progress: false

permissions: {}

jobs:
  analyze:
    name: Analyze
    permissions:
      contents: read
      security-events: write # required to upload SARIF results
    uses: starhaven-io/.github/.github/workflows/reusable-codeql.yml@24c92ca6f7f84ca1a76f1958f068e2b586a6015e # v2026.10.10.4
    with:
      languages: '["actions","ruby"]'
      runner: "ubuntu-slim"
      timeout-minutes: 30
      build-mode: ""
      build-profile: ""
