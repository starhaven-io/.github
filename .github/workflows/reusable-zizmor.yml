name: Reusable zizmor # zizmor: ignore[excessive-permissions]

on:
  workflow_call:
    inputs:
      advanced-security:
        type: boolean
        default: true
      timeout-minutes:
        type: number
        default: 15

# Permissions inherit from the caller: SARIF consumers grant security-events,
# PR-time and no-GHAS callers grant contents only. Declaring more here than a
# caller grants fails the run at startup.

jobs:
  zizmor: # zizmor: ignore[excessive-permissions]
    name: Analyze
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Analyze workflows
        id: analyze
        env:
          ZIZMOR_IMAGE: "ghcr.io/zizmorcore/zizmor:1.31.1@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9"
          GH_TOKEN: ${{ github.token }}
          ADVANCED_SECURITY: ${{ inputs.advanced-security }}
        shell: bash -euo pipefail {0}
        run: |
          arguments=(--strict-collection --persona auditor)
          if [[ "${ADVANCED_SECURITY}" == "true" ]]; then
            arguments+=(--format sarif)
          fi
          report="${RUNNER_TEMP}/zizmor-results"
          if docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            --workdir /workspace --env GH_TOKEN \
            "${ZIZMOR_IMAGE}" "${arguments[@]}" -- . > "${report}"; then
            if [[ "${ADVANCED_SECURITY}" == "true" ]]; then
              echo "sarif-file=${report}" >> "${GITHUB_OUTPUT}"
              findings=$(jq '[.runs[].results[]?] | length' "${report}")
              echo "findings=${findings}" >> "${GITHUB_OUTPUT}"
            else
              cat "${report}"
            fi
          else
            status=$?
            cat "${report}"
            exit "${status}"
          fi

      - name: Upload SARIF
        if: inputs.advanced-security
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: ${{ steps.analyze.outputs.sarif-file }}
          category: zizmor

      # zizmor exits 0 whenever it writes SARIF, so gate only after the upload
      # has put the findings in code scanning.
      - name: Fail on findings
        if: inputs.advanced-security
        env:
          FINDINGS: ${{ steps.analyze.outputs.findings }}
        shell: bash -euo pipefail {0}
        run: |
          if [[ ! "${FINDINGS}" =~ ^[0-9]+$ ]]; then
            echo "::error::zizmor did not report a SARIF finding count"
            exit 1
          fi
          if (( FINDINGS > 0 )); then
            echo "::error::zizmor reported ${FINDINGS} finding(s); see the zizmor code-scanning category for details"
            exit 1
          fi
