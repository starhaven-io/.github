name: Reusable zizmor # zizmor: ignore[excessive-permissions]

on:
  workflow_call:
    inputs:
      advanced-security:
        type: boolean
        default: true
      timeout-minutes:
        type: number
        default: 15

# Permissions inherit from the caller: SARIF consumers grant security-events,
# PR-time and no-GHAS callers grant contents only. Declaring more here than a
# caller grants fails the run at startup.

jobs:
  zizmor: # zizmor: ignore[excessive-permissions]
    name: Analyze
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Analyze workflows
        id: analyze
        env:
          ZIZMOR_IMAGE: "ghcr.io/zizmorcore/zizmor:1.30.0@sha256:1ba0035c343f50e85fde29beb0d78e4db448eaa0c762a11a09805d241424ee03"
          GH_TOKEN: ${{ github.token }}
          ADVANCED_SECURITY: ${{ inputs.advanced-security }}
        shell: bash -euo pipefail {0}
        run: |
          arguments=(--strict-collection --persona auditor)
          if [[ "${ADVANCED_SECURITY}" == "true" ]]; then
            arguments+=(--format sarif)
          fi
          report="${RUNNER_TEMP}/zizmor-results"
          if docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            --workdir /workspace --env GH_TOKEN \
            "${ZIZMOR_IMAGE}" "${arguments[@]}" -- . > "${report}"; then
            if [[ "${ADVANCED_SECURITY}" == "true" ]]; then
              echo "sarif-file=${report}" >> "${GITHUB_OUTPUT}"
            else
              cat "${report}"
            fi
          else
            status=$?
            cat "${report}"
            exit "${status}"
          fi

      - name: Upload SARIF
        if: inputs.advanced-security
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: ${{ steps.analyze.outputs.sarif-file }}
          category: zizmor
