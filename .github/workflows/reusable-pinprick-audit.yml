name: Reusable pinprick audit # zizmor: ignore[excessive-permissions]

on:
  workflow_call:
    inputs:
      advanced-security:
        type: boolean
        required: true
      fail-on-findings:
        type: boolean
        required: true
      timeout-minutes:
        type: number
        default: 15

# Permissions inherit from the caller: SARIF consumers grant security-events,
# no-GHAS private repos grant contents only. Declaring more here than a caller
# grants fails the run at startup.

jobs:
  audit: # zizmor: ignore[excessive-permissions]
    name: Audit
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run pinprick
        uses: starhaven-io/pinprick-action@d1ad02330903473ce59ddb88b88ae36f4a4e0bf5 # v0.6.8
        with:
          # Fork pull requests cannot upload SARIF with the read-only token.
          advanced-security: ${{ inputs.advanced-security }}
          fail-on-findings: ${{ inputs.fail-on-findings }}
          # Only these consumers' complete configs are fleet-owned and protected
          # by the required trusted-main guard, including policy additions and
          # removals.
          no-repo-config: ${{ !contains(fromJSON('["starhaven-io/Brewy","starhaven-io/homebrew-tap","starhaven-io/macOSdb","starhaven-io/pkgstory"]'), github.repository) }}
